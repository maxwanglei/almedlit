      - ${AL_MEDLIT_MINIO_CERTS_DIR:-./certs/minio}:/etc/al-medlit/minio-certs:ro
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  pg_data:
  minio_data:
  attempt_data:
